name: Audit

# Checks Cargo.lock against the RustSec advisory database. Fails on known
# vulnerabilities; unmaintained or unsound crates are reported as warnings.
on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, .github/workflows/audit.yml]
  # Weekly, so new advisories show up even when nothing is pushed
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
