name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: just check

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    # Built on an older glibc than current distros so the binary runs on them too
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deb
      - uses: Swatinem/rust-cache@v2
      - run: just build-release --locked
      - name: Build .deb
        run: cargo deb --no-build
      - name: Vendor tarball (Rust sources for offline distro builds)
        run: just vendor-tarball "cosmic-applet-updates-${GITHUB_REF_NAME#v}-vendor.tar.xz"
      - name: Package
        run: |
          dir=cosmic-applet-updates-${GITHUB_REF_NAME}-x86_64
          mkdir -p "$dir/target/release"
          cp target/release/cosmic-applet-updates "$dir/target/release/"
          cp -r data justfile LICENSE README.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cosmic-applet-updates-*.tar.gz
            cosmic-applet-updates-*.tar.gz.sha256
            cosmic-applet-updates-*-vendor.tar.xz
            target/debian/*.deb
          generate_release_notes: true
