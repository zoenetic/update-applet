[package]
name = "cosmic-applet-updates"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "COSMIC panel applet that shows and installs available system and Flatpak updates"
repository = "https://github.com/zoenetic/update-applet"
rust-version = "1.93"

[dependencies]
futures = "0.3"
i18n-embed = { version = "0.16.0", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "desktop-systemd-scope",
    "winit",
] }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
zbus = { version = "5.14.0", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"

[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

# `cargo deb` builds the .deb for Pop!_OS, Ubuntu and Debian.
[package.metadata.deb]
maintainer = "zoenetic"
copyright = "2026, the cosmic-applet-updates authors"
section = "utils"
priority = "optional"
extended-description = """\
A COSMIC panel applet that shows available system and Flatpak updates and \
installs them through PackageKit."""
# libwayland-client is loaded at runtime, so shlibdeps cannot see it.
depends = "$auto, libwayland-client0"
recommends = "packagekit, flatpak"
assets = [
    ["target/release/cosmic-applet-updates", "usr/bin/", "755"],
    ["data/io.github.zoenetic.CosmicAppletUpdates.desktop", "usr/share/applications/", "644"],
    ["data/io.github.zoenetic.CosmicAppletUpdates.Settings.desktop", "usr/share/applications/", "644"],
    ["data/icons/scalable/apps/io.github.zoenetic.CosmicAppletUpdates-symbolic.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
